<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>ZAHRTI — إعادة التوجيه</title>
    <script>
      (function () {
        var pathname = window.location.pathname || '/';
        // Do not redirect missing static asset files
        if (/\.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|json|pdf|map)$/i.test(pathname)) {
          return;
        }
        var base = '/';
        var route = pathname;
        var segments = pathname.split('/').filter(Boolean);
        // On GitHub Pages project sites (username.github.io/repo-name/...), preserve the repo segment
        if (window.location.hostname.endsWith('github.io') && segments.length > 0) {
          base = '/' + segments[0] + '/';
          route = '/' + segments.slice(1).join('/');
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var cleanRoute = route === '/' || route === '/index.html' ? '' : route.replace(/^\/+/, '');
        var targetHash = hash && hash.length > 1 ? hash : '#/' + cleanRoute;
        window.location.replace(base + targetHash + search);
      })();
    </script>
  </head>
  <body style="background:#F9F3EC;color:#351B38;font-family:system-ui,sans-serif;padding:2rem;text-align:center;">
    <p>جاري تحويلكِ إلى زهرتي...</p>
  </body>
</html>
